<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 校样办公室</title><link rel="stylesheet" href="/style.css"><script defer src="/login.js"></script></head>
<body class="login-body"><main class="login-layout"><section class="login-intro"><div class="brand"><span class="brand-icon">校</span><div><strong>校样</strong><small>办公室共享工作台</small></div></div><div class="eyebrow">项目规范 · 活动稿件 · 设计送审</div><h1>一份品牌规范，<br>整个团队共用。</h1><p>编导维护文案，设计上传成稿。<br>每篇稿件的版本和审核记录，统一保存在办公室服务器。</p><div class="login-steps"><span>01 项目 Guide</span><span>02 本篇定稿</span><span>03 上传审核</span></div></section><section class="card login-card"><h2 id="login-title">登录工作台</h2><p id="login-subtitle" class="muted">已有账号直接登录，新同事可自行注册。</p><form id="login-form"><div id="setup-fields" hidden><label>服务器初始化码<input id="setup-code" autocomplete="off" maxlength="100"></label><label>管理员姓名<input id="setup-name" autocomplete="name" maxlength="40"></label></div><label>用户名<input id="login-user" autocomplete="username" required maxlength="40" placeholder="例如：zhangsan"></label><label>密码<input id="login-password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" placeholder="至少10个字符"></label><label id="register-position" hidden>职位<select id="register-role"><option value="director">编导</option><option value="operator">运营</option><option value="designer">设计</option></select></label><button class="primary" id="login-submit" type="submit">登录</button><div id="login-message" role="alert" class="hint"></div></form><button id="login-switch" class="quiet" type="button" hidden>没有账号？自行注册</button><div class="login-foot">资料保存在服务器 · API Key 由管理员统一配置<br>忘记密码请联系管理员。</div></section></main></body></html>
