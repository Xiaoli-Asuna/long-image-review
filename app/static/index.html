<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校样 · 长图视觉审稿</title><link rel="stylesheet" href="/style.css"><script defer src="/app.js"></script></head><body>
<aside class="sidebar"><div class="brand"><span class="brand-icon">校</span><div><strong>校样</strong><small>长图视觉审稿</small></div></div><div class="edition">单机版 · v1.0.0</div><nav>
<button data-nav="home"><span>概览</span></button><button data-nav="project"><span>项目规范</span><small>长期品牌资产</small></button><button data-nav="articles"><span>稿件文案</span><small>编导 / 运营</small></button><button data-nav="review"><span>设计送审</span><small>设计</small></button><button data-nav="history"><span>审核记录</span></button><div class="nav-divider"></div><button data-nav="settings"><span>API 设置</span><i id="api-dot"></i></button></nav><div class="sidebar-bottom"><span class="local-dot"></span> 资料保存在本机<br><small>上传 Guide 自动解析 · API 调用</small></div></aside>
<div class="shell"><header><div class="project-switch"><span>当前项目</span><select id="project-select" aria-label="当前项目"></select><span id="article-switch" class="article-switch" hidden><span>稿件</span><select id="article-select" aria-label="当前稿件"></select><button class="quiet" data-action="new-article">＋ 新建稿件</button></span><button class="quiet" data-action="new-project">＋ 新建项目</button></div><div class="header-actions"><span class="model-chip" id="model-chip">未配置 API</span><button class="quiet" data-action="shutdown">退出程序</button></div></header><main id="main"><div class="empty">正在打开本机工作台…</div></main></div>
<div id="toast" role="alert" hidden></div><dialog id="new-project-dialog"><form id="new-project-form"><div class="dialog-head"><h2>新建审核项目</h2><button type="button" class="quiet" data-action="close-dialog">关闭</button></div><p class="muted">一个长期运营项目保存一套品牌规范，多篇活动稿件共用。</p><label>项目名称<input name="name" id="new-project-name" maxlength="100" required placeholder="例如：秋季品牌活动"></label><button class="primary" type="submit">创建项目</button></form></dialog>
<dialog id="new-article-dialog"><form id="new-article-form"><div class="dialog-head"><h2>新建稿件</h2><button type="button" class="quiet" data-action="close-article-dialog">关闭</button></div><p class="muted">所属长期项目：<strong id="new-article-project"></strong></p><label>稿件标题<input id="new-article-title" maxlength="100" required placeholder="例如：10月版本更新 / 万圣活动机制介绍"></label><label>内容类型<select id="new-article-type"><option>游戏活动</option><option>版本更新</option><option>商业化上新</option><option>其他</option></select></label><button class="primary" type="submit">创建稿件</button></form></dialog>
<input type="file" id="file-guide" accept=".pdf,.png,.jpg,.jpeg,.txt,.md,.docx" multiple hidden><input type="file" id="file-logo" accept=".png,.jpg,.jpeg" multiple hidden><input type="file" id="file-design" accept=".png,.jpg,.jpeg" hidden><input type="file" id="file-copy" accept=".xlsx,.txt,.md,.docx" hidden>
</body></html>
