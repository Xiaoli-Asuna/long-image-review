name: Offline Windows checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          architecture: x64
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_release.py --tracked
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - run: node --check app/static/login.js
